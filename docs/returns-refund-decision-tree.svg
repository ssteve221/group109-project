<svg width="680" height="590" viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<title>Returns and refund eligibility decision tree</title>
<desc>Flowchart showing how the chatbot determines return eligibility: check the order exists, then whether it's cancelled, delivered, and within the 30-day return window.</desc>
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="590" fill="#FFFFFF"/>

<line x1="270" y1="64" x2="270" y2="94" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="270" y1="160" x2="270" y2="190" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="270" y1="256" x2="270" y2="286" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="270" y1="352" x2="270" y2="382" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="390" y1="132" x2="450" y2="132" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="390" y1="228" x2="450" y2="228" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="390" y1="324" x2="450" y2="324" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<path d="M270 448 L270 468 L265 468 L265 478" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<path d="M270 448 L270 468 L525 468 L525 478" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<text x="420" y="122" text-anchor="middle" font-size="12" fill="#5F5E5A">no</text>
<text x="420" y="218" text-anchor="middle" font-size="12" fill="#5F5E5A">no</text>
<text x="420" y="314" text-anchor="middle" font-size="12" fill="#5F5E5A">no</text>
<text x="265" y="465" text-anchor="middle" font-size="12" fill="#5F5E5A">no</text>
<text x="525" y="465" text-anchor="middle" font-size="12" fill="#5F5E5A">yes</text>

<!-- Start -->
<rect x="150" y="20" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="270" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Order ID entered</text>

<!-- Order found? -->
<rect x="150" y="104" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="270" y="122" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Order found?</text>
<text x="270" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Match ID in dataset</text>

<rect x="460" y="104" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="122" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Not found</text>
<text x="550" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Ask to check email</text>

<!-- Cancelled? -->
<rect x="150" y="200" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="270" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Cancelled?</text>
<text x="270" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Check status field</text>

<rect x="460" y="200" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Nothing to return</text>
<text x="550" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Refund already sent</text>

<!-- Delivered yet? -->
<rect x="150" y="296" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="270" y="314" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Delivered yet?</text>
<text x="270" y="334" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Check status field</text>

<rect x="460" y="296" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="314" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Not yet eligible</text>
<text x="550" y="334" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Wait until delivered</text>

<!-- Within 30 days? -->
<rect x="150" y="392" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="270" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Within 30 days?</text>
<text x="270" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Since delivery date</text>

<!-- Terminal outcomes -->
<rect x="155" y="488" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="265" y="506" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Past window</text>
<text x="265" y="526" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Offer escalation path</text>

<rect x="415" y="488" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="525" y="506" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Eligible</text>
<text x="525" y="526" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Offer return + refund ETA</text>

<text x="340" y="572" text-anchor="middle" font-size="12" fill="#888780">Gray = check &#183; Coral = blocked &#183; Teal = resolved</text>
</svg>
