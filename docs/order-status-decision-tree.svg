<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<title>Order status decision tree</title>
<desc>Flowchart showing how the chatbot resolves an order-status question: check if the order ID exists, then branch to a not-found message or a status-specific reply.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

<line x1="340" y1="64" x2="340" y2="94" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 160 L340 180 L200 180 L200 190" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 160 L340 180 L480 180 L480 190" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="480" y1="256" x2="480" y2="286" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="270" y="175" text-anchor="middle" font-size="12" fill="#5F5E5A">no</text>
<text x="410" y="175" text-anchor="middle" font-size="12" fill="#5F5E5A">yes</text>

<!-- Start -->
<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Order ID entered</text>

<!-- Decision -->
<rect x="220" y="104" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Order found?</text>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Match ID in dataset</text>

<!-- Not found -->
<rect x="100" y="200" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="200" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Not found</text>
<text x="200" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Ask to check email</text>

<!-- Found -->
<rect x="380" y="200" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Found</text>
<text x="480" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Look up order status</text>

<!-- Return status message -->
<rect x="370" y="296" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="480" y="314" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Return status message</text>
<text x="480" y="334" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">5 status-specific replies</text>

<text x="340" y="380" text-anchor="middle" font-size="12" fill="#888780">Gray = check &#183; Coral = blocked &#183; Teal = resolved</text>
</svg>
